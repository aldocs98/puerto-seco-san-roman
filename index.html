<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infraplan · Puerto Seco de San Román</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f2f0;color:#363636;font:15px Arial}main{width:min(440px,92vw);background:#fff;padding:38px;border-top:6px solid #ffbe00;box-shadow:0 10px 45px #0001}img{width:170px}h1{font-size:25px;line-height:1.3;margin-top:30px}p{line-height:1.5;color:#666}label{display:block;margin:19px 0 7px}input,button{width:100%;padding:13px;font:inherit;border:1px solid #bbb;border-radius:4px}button{margin-top:23px;background:#ffbe00;border-color:#ffbe00;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}#message{min-height:38px;font-size:13px}small{color:#777}</style></head><body><main><img src="logo.png" alt="Infraplan"><h1>Puerto Seco de San Román</h1><p>Modelo logístico base<br>Entregable 1 · Juliaca</p><form id="login"><label for="user">Usuario</label><input id="user" autocomplete="username" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button id="enter">Ingresar al WebGIS</button><p id="message" role="status"></p></form><small>Acceso al estudio y a su cartografía.</small></main><script>
const login=document.getElementById('login');
login.addEventListener('submit',async e=>{e.preventDefault();const message=document.getElementById('message'),button=document.getElementById('enter');button.disabled=true;message.textContent='Abriendo el estudio. La primera carga puede tardar unos segundos…';try{if(!window.crypto?.subtle)throw new Error('Abra el sitio mediante HTTPS o desde localhost.');const r=await fetch('paquete.enc',{cache:'no-store'});if(!r.ok)throw new Error('No se encontró paquete.enc. Publique todos los archivos de PUBLICAR.');const a=new Uint8Array(await r.arrayBuffer());if(new TextDecoder().decode(a.slice(0,8))!=='E1GIS001')throw new Error('El paquete publicado no corresponde a esta versión.');const user=document.getElementById('user').value.trim().toLowerCase(),password=document.getElementById('password').value;const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(user+'\0'+password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:a.slice(8,24),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(24,36)},key,a.slice(36))}catch{throw new Error('Usuario o contraseña incorrectos.')}if(!window.DecompressionStream)throw new Error('Use una versión actual de Chrome, Edge o Firefox.');const stream=new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.getElementById('password').value='';document.open();document.write(html);document.close()}catch(error){message.textContent=error.message;button.disabled=false}});
</script></body></html>
